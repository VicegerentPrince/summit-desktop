# Redragon GM303 USB microphone (USB id 3206:4000).
#
# The microphone tells the system that its 90 volume steps span 0.35 dB in total (and its
# headphone output's 100 steps 0.39 dB), which is wrong. Believing that, PipeWire leaves the
# hardware volume on step 0 and does the rest in software, and step 0 on this device is silence:
# the microphone records nothing and its headphone jack plays nothing.
#
# Ignoring the reported decibel figures makes the volume slider drive the hardware steps directly.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-USB_Audio_GM303*" }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
      }
    }
  }
]

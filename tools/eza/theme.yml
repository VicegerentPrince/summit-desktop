  # Archives and packages: red
  tar: &archive {filename: {foreground: "#f47067"}}
  tgz: *archive
  tbz: *archive
  tbz2: *archive
  txz: *archive
  tzst: *archive
  gz: *archive
  bz2: *archive
  xz: *archive

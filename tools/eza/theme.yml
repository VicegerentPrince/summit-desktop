  heif: *media
  jxl: *media
  ico: *media
  icns: *media
  svg: *media
  svgz: *media
  eps: *media
  psd: *media
  xcf: *media
  kra: *media
  raw: *media
  cr2: *media
  cr3: *media
  nef: *media
  dng: *media
  arw: *media
  orf: *media
  rw2: *media
  mp4: *media
  m4v: *media
  mkv: *media
  webm: *media
  mov: *media
  avi: *media
  wmv: *media
  flv: *media
  mpg: *media
  mpeg: *media
  ogv: *media
  3gp: *media
  vob: *media
  m2ts: *media
  mts: *media
  mp3: *media
  flac: *media
  wav: *media
  ogg: *media
  oga: *media
  opus: *media
  m4a: *media
  aac: *media
  wma: *media
  aiff: *media
  aif: *media
  mid: *media
  midi: *media
  mka: *media

#? Config file for btop v.1.4.7
# Summit: only the keys that shape the look and feel. Everything else is
# btop's default.
# The line above has to stay first and name the installed version. btop
# leaves the file alone as long as it matches; after a btop update, or once a
# setting is changed from inside btop, it rewrites the file in its own long
# form (all keys, these comments gone) and keeps the values below.

#* Theme file from ~/.config/btop/themes, matched by name.
color_theme = "summit"

#* false: the terminal's own background shows through.
theme_background = false

truecolor = true
rounded_corners = true
graph_symbol = "braille"
update_ms = 2000

#* Process list: cpu colours on, no fade towards the bottom of the list.
proc_colors = true
proc_gradient = false

vim_keys = false

#* Temperatures, per core too, in Celsius.
check_temp = true
show_coretemp = true
temp_scale = "celsius"

#* Clock in the top bar without seconds.
clock_format = "%H:%M"

# Summit · tmux 3.7c
# Installs to ~/.config/tmux/tmux.conf        Prefix stays C-b.
# Hex colours are lower case on purpose: inside a format string "#D" and "#F"
# are tmux aliases (pane id, window flags), so "#DCE3EA" would be mangled.

# ── Terminal ────────────────────────────────────────────────────────────────
set -s  default-terminal "tmux-256color"
# tmux does not auto-detect kitty, so its abilities are declared here: true
# colour, styled and coloured underlines (undercurl), strikethrough,
# synchronized output and OSC 8 hyperlinks. Same list for a terminal that
# only announces itself as xterm-256color.
set -as terminal-features ",xterm-kitty:RGB:usstyle:strikethrough:sync:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:usstyle:strikethrough:sync:hyperlinks"
set -s  focus-events on
set -s  escape-time 0
# Applications inside tmux may ask for extended key reporting. kitty itself
# ignores the request tmux sends outward (xterm's modifyOtherKeys), so under
# kitty this adds nothing; it takes effect in terminals that honour it.
set -s  extended-keys on
# OSC 52 both ways: copies made in tmux reach the system clipboard, and
# programs inside tmux may set it too.
set -s  set-clipboard on
# Lets programs talk to kitty directly (image previews in yazi).
set -gw allow-passthrough on

# ── Behaviour ───────────────────────────────────────────────────────────────
# The login shell is bash while kitty starts zsh explicitly; without this line
# new panes would open bash.
set -g  default-shell /usr/bin/zsh
set -g  mouse on
set -g  history-limit 50000
set -g  base-index 1
set -gw pane-base-index 1
set -g  renumber-windows on
set -gw mode-keys vi

# ── Keys ────────────────────────────────────────────────────────────────────
# Splits that say what they do and open in the current directory.
bind '|' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# vi copy mode: v selects, C-v switches to a block, y copies and leaves.
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y   send-keys -X copy-pipe-and-cancel

# Wheel over a full-screen program that does not read the mouse itself (less,
# man, the pagers of bat and delta): tmux 3.7 drops those events, so they are
# turned into arrow keys here, which is what kitty does outside tmux. Three
# lines per step. The other cases are tmux's defaults: programs that read the
# mouse get the event, a plain shell scrolls back through copy mode.
bind -n WheelUpPane   if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if -F "#{alternate_on}" { send-keys -N 3 Up } { copy-mode -e } }
bind -n WheelDownPane if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { if -F "#{alternate_on}" { send-keys -N 3 Down } }

# ── Status line ─────────────────────────────────────────────────────────────
# Session name in teal (amber while the prefix is held), windows like kitty's
# tabs, host and time kept quiet on the right.
set -g  status-position bottom
set -g  status-justify left
set -g  status-style "bg=#1d232c,fg=#8693a1"
set -g  status-left-length 32
set -g  status-left "#[fg=#{?client_prefix,#e3b341,#4fd1c5},bold] #S #[default]"
set -g  status-right "#[fg=#5c6773]#h  #[fg=#8693a1]%H:%M "

set -gw window-status-separator ""
set -gw window-status-format         " #I #W#{?window_zoomed_flag, 󰊓,}#{?window_bell_flag, ●,}#{?window_activity_flag, ◦,} "
set -gw window-status-current-format " #I #W#{?window_zoomed_flag, 󰊓,} "
set -gw window-status-style          "fg=#8693a1"
set -gw window-status-current-style  "bg=#28313d,fg=#f0f4f8,bold"
set -gw window-status-bell-style     "fg=#e3b341"
set -gw window-status-activity-style "fg=#7cb7ff"

# ── Panes ───────────────────────────────────────────────────────────────────
# Active border teal; tmux's own cues are kept in palette colours: amber in
# copy mode, red while panes are synchronized.
set -gw pane-border-lines single
set -gw pane-border-style "fg=#5c6773"
set -gw pane-active-border-style "#{?pane_in_mode,fg=#e3b341,#{?synchronize-panes,fg=#f47067,fg=#4fd1c5}}"
set -g  display-panes-colour "#5c6773"
set -g  display-panes-active-colour "#4fd1c5"

# ── Messages, modes, menus ──────────────────────────────────────────────────
# 3.7 paints the message line through fill=; without it the status line shows
# through around the text.
set -g  message-style         "bg=#28313d,fg=#f0f4f8,fill=#28313d"
set -g  message-command-style "bg=#28313d,fg=#e3b341,fill=#28313d"

# Selection in copy mode and the highlighted row in choosers.
set -gw mode-style "bg=#223f44,fg=#f0f4f8"
set -gw copy-mode-position-style      "bg=#28313d,fg=#8693a1"
set -gw copy-mode-match-style         "bg=#323d4b,fg=#e3b341"
set -gw copy-mode-current-match-style "bg=#e3b341,fg=#171c23"
set -gw copy-mode-mark-style          "bg=#323d4b,fg=#f0f4f8"

set -gw menu-style          "bg=#1d232c,fg=#dce3ea"
set -gw menu-selected-style "bg=#28313d,fg=#f0f4f8"
set -gw menu-border-style   "bg=#1d232c,fg=#434952"
set -gw menu-border-lines   rounded
set -gw popup-border-style  "fg=#434952"
set -gw popup-border-lines  rounded

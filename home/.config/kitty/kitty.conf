# kitty — main terminal. Everything here is a deliberate change from kitty's defaults;
# run `kitty +kitten show_key` or see https://sw.kovidgoyal.net/kitty/conf/ for the rest.
# Reload after editing: ctrl+shift+f5.

include summit.conf

# ---- text ---------------------------------------------------------------------------------
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# ligatures everywhere except under the cursor, so the character being edited is never merged
disable_ligatures cursor
# Nerd Font glyphs (prompt and file icons) come from kitty's built-in symbol font. The ranges are
# pinned to it because Inter, Adwaita Sans and OpenSymbol also carry private-use glyphs at about
# 400 of the same codes, and the system would otherwise hand some of those out instead.
symbol_map U+e000-U+e00a,U+e0a0-U+e0a3,U+e0b0-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ea60-U+ec1e,U+ed00-U+efce,U+f000-U+f2ff,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono
undercurl_style  thin-sparse

# ---- cursor -------------------------------------------------------------------------------
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_blink_interval     0.6 ease-in-out
cursor_stop_blinking_after 12.0
# a short trail when the cursor jumps a long way, so the eye can follow it
cursor_trail              3
cursor_trail_decay        0.08 0.3
cursor_trail_start_threshold 4

# ---- window -------------------------------------------------------------------------------
shell                     /usr/bin/zsh
remember_window_size      no
initial_window_width      126c
initial_window_height     34c
window_padding_width      8 12
placement_strategy        top-left
enabled_layouts           splits,stack
window_border_width       1.5px
# splits are separate rounded panes with a little air between them; a single pane fills the window
draw_minimal_borders      no
window_border_radius      7pt
window_margin_width       3
single_window_margin_width 0
inactive_text_alpha       0.78
# glass, like the Konsole profile. ctrl+shift+a then 1 makes it solid, then d restores this.
background_opacity        0.92
background_blur           1
dynamic_background_opacity yes
confirm_os_window_close   -1

# ---- tabs ---------------------------------------------------------------------------------
# Shown from two tabs up. The tab you are in is a teal-tinted pill, the others plain text on the
# glass. Each shows its number (alt+number jumps to it), an icon for what is running there, the
# folder, and the command when it is not just a shell. The icon and text come from tab_bar.py.
tab_bar_edge              top
tab_bar_style             separator
tab_separator             ""
tab_bar_min_tabs          2
tab_bar_align             left
tab_bar_margin_height     6.0 4.0
tab_bar_margin_width      4.0
tab_title_template        " {fmt.fg._5c6773}{index}{fmt.fg.tab} {custom}{bell_symbol}{activity_symbol} "
active_tab_title_template "{fmt.bg.default}{fmt.fg._223f44}{fmt.bg._223f44}{fmt.fg._81e6d9}{index}{fmt.fg._f0f4f8} {custom}{fmt.bg.default}{fmt.fg._223f44}"
bell_on_tab               " ●"
tab_activity_symbol       " ◦"

# ---- scrollback and mouse ------------------------------------------------------------------
# a slim teal handle on the right edge, only while you are scrolled back
scrollbar                 scrolled
scrollbar_handle_color    #4fd1c5
scrollbar_handle_opacity  0.55
scrollbar_width           0.45
scrollbar_radius          0.2
scrollback_lines          20000
scrollback_pager_history_size 32
wheel_scroll_multiplier   3.0
mouse_hide_wait           2.0
url_style                 straight
show_hyperlink_targets    yes
strip_trailing_spaces     smart

# ---- bell and notifications -----------------------------------------------------------------
enable_audio_bell         no
window_alert_on_bell      yes
# a desktop notification when a command that ran for 20 s or more finishes in a window you are not looking at
notify_on_cmd_finish      invisible 20.0 notify

# ---- keys (kitty_mod is ctrl+shift) -----------------------------------------------------------
# new tabs and splits open in the directory you are in. "oldest" = the folder of the program you
# started in the pane (the shell, or claude); "current" would follow helpers such as wl-copy, which
# linger in the background sitting in /.
map kitty_mod+t           launch --type=tab --cwd=oldest
# a new window from here opens in the same folder and gets the welcome card
map kitty_mod+n           launch --type=os-window --cwd=oldest --env SUMMIT_WELCOME=1
map kitty_mod+enter       launch --location=split --cwd=oldest
map kitty_mod+backslash   launch --location=vsplit --cwd=oldest
map kitty_mod+minus       launch --location=hsplit --cwd=oldest
# move between splits
map ctrl+alt+left         neighboring_window left
map ctrl+alt+right        neighboring_window right
map ctrl+alt+up           neighboring_window up
map ctrl+alt+down         neighboring_window down
# zoom the current split to the whole window and back
map kitty_mod+m           toggle_layout stack
# jump straight to a tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
# search the scrollback with fzf-style incremental search in the pager
map kitty_mod+slash       show_scrollback

# accent colour taken from the wallpaper by `wall` (cursor, current tab, active border); last so it wins
include accent.conf

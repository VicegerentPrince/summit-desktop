# atuin — shell history search on Ctrl+R. Local only: nothing is synced or uploaded.
# Full reference: `atuin default-config`.

auto_sync = false
update_check = false

# searching
search_mode = "fuzzy"
filter_mode = "global"            # Ctrl+R again cycles: global, this project, this folder, this session
workspaces = true                 # "project" = the git repository you are in
filter_mode_shell_up_key_binding = "session"

# the list
style = "compact"
inline_height = 20                # a panel under the prompt, not a full-screen takeover
invert = true                     # search box on top, results below it, like the other pickers
show_preview = true
max_preview_height = 4
show_help = false
show_tabs = false
exit_mode = "return-original"
enter_accept = false              # Enter puts the command on the prompt for a look; Enter again runs it
keymap_mode = "auto"

# what is kept
secrets_filter = true
store_failed = true
history_filter = [
    '^\s*export\s+\w*(TOKEN|SECRET|PASSWORD|PASSWD|KEY)\w*=',
    '(?i)(--password|--token|--secret)[= ]\S+',
]

# History is written through a small background process instead of opening the database before
# every command. On this disk (btrfs) a direct write costs 10 ms and, once the database's log
# has grown, about 80 ms per command; through the daemon it is a steady 6 ms. It starts itself
# when needed, uses no CPU while idle, and `atuin daemon status` shows it.
[daemon]
enabled = true
autostart = true

[search]
filters = ["global", "workspace", "directory", "session"]

[ui]
columns = ["time", "command"]   # imported history has no durations, so that column is left out

[theme]
name = "summit"

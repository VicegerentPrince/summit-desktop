<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The generic "monospace" family resolves to JetBrains Mono, so code looks the same in the
     browser, in GTK apps and in the terminal. Everything else is left to the system defaults. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
